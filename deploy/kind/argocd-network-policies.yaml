# NetworkPolicies of Argo CD for development. The policies of the Helm
# chart let all namespaces connect to the metrics, which tell the names,
# the repositories and the namespaces of the applications of all tenants.
# The chart has no setting for this, thus the chart makes no policies
# (global.networkPolicy.create: false), and these replace them. The
# development environment has no Prometheus, thus no pod can connect to
# the metrics. The kubelet can still check the health of the pods. See
# docs/security.md.
#
# No pod can connect to a pod of Argo CD, except as the next policies
# permit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: squared-default-deny
  namespace: argocd
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The web interface, the API and the webhook of Forgejo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: squared-argocd-server
  namespace: argocd
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: argocd-server }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: server }]
---
# The repository server renders the manifests of each repository for each
# caller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: squared-argocd-repo-server
  namespace: argocd
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: argocd-repo-server }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: argocd-server } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: argocd-application-controller } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: argocd-applicationset-controller } }
      ports: [{ port: repo-server }]
---
# Redis has the cache with the manifests.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: squared-argocd-redis
  namespace: argocd
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: argocd-redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: argocd-server } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: argocd-repo-server } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: argocd-application-controller } }
      ports: [{ port: redis }]
