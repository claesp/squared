# The project default of Argo CD permits all repositories, clusters and
# kinds. Squared does not use it, thus it permits nothing: an application
# in it cannot deploy. The rights of the application controller follow the
# other projects.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
  namespaceResourceWhitelist: []
---
# The root application of Squared. It applies the platform repository,
# which only the Squared worker writes. The project limits the kinds of
# objects to the kinds that the platform repository contains.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: squared-platform
  namespace: argocd
spec:
  description: Tenant namespaces, limits, RBAC and Argo CD objects that Squared makes
  sourceRepos:
    - http://forgejo.localhost:30300/squared/platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: argoproj.io
      kind: AppProject
    - group: argoproj.io
      kind: Application
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: squared-platform
  namespace: argocd
spec:
  project: squared-platform
  source:
    repoURL: http://forgejo.localhost:30300/squared/platform.git
    targetRevision: main
    path: tenants
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
