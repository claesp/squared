# Argo CD for development (chart argo/argo-cd). The Keycloak client secret
# comes from hack/kind-up.sh.
configs:
  params:
    server.insecure: true
    # Squared needs no SCM provider and pull request generators. With them,
    # an ApplicationSet can send the token of a Secret in its namespace to
    # a server (see docs/security.md).
    applicationsetcontroller.enable.scm.providers: false
    # An ApplicationSet must not update the applications that it made: one
    # that takes over an application of Squared would write its template
    # into it again after each repair (see docs/security.md).
    applicationsetcontroller.policy: create-only
    applicationsetcontroller.enable.policy.override: false
  cm:
    url: http://localhost:30081
    # The application controller reads only the kinds that its RBAC
    # permits, and skips the others.
    resource.respectRBAC: normal
    # Forgejo sends a webhook after each push. The poll interval is only a
    # fallback.
    timeout.reconciliation: 60s
    # Sign-in with Keycloak. Argo CD reads the client secret from the key
    # oidc.keycloak.clientSecret of the secret argocd-secret.
    oidc.config: |
      name: Keycloak
      issuer: http://keycloak.localhost:30180/realms/squared
      clientID: argocd
      clientSecret: $oidc.keycloak.clientSecret
      enablePKCEAuthentication: true
      requestedScopes: ["openid", "profile", "email"]
    # The Squared guard reads the repositories, the credential templates and
    # the clusters (never their secrets) with a token of this account. It
    # cannot sign in.
    accounts.squared-guard: apiKey
  rbac:
    # Members of the Keycloak group squared-admins are administrators. The
    # groups claim has full paths: a subgroup with the same name does not
    # match.
    # Other users have no rights: tenants use Squared, not Argo CD.
    # The account squared-guard can only read the repositories and the
    # clusters.
    policy.default: ""
    policy.csv: |
      g, /squared-admins, role:admin
      p, squared-guard, repositories, get, *, allow
      p, squared-guard, write-repositories, get, *, allow
      p, squared-guard, clusters, get, *, allow
    scopes: "[groups]"
dex:
  enabled: false
notifications:
  enabled: false
server:
  service:
    type: NodePort
    nodePortHttp: 30081
  # The API server shows the objects, the events and the logs of the
  # applications, runs resource actions (patch) and removes objects
  # (delete), only on the kinds of the projects of Squared. The chart
  # gives it get, patch and delete on all kinds in the cluster, also on
  # Secrets (see docs/security.md). Without create on Jobs, the action
  # "create job" of a CronJob does not work.
  clusterRoleRules:
    enabled: true
    rules:
      - apiGroups: [""]
        resources: [namespaces, resourcequotas, limitranges, configmaps, serviceaccounts, services]
        verbs: [get, patch, delete]
      - apiGroups: [networking.k8s.io]
        resources: [networkpolicies, ingresses]
        verbs: [get, patch, delete]
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [rolebindings]
        verbs: [get, patch, delete]
      - apiGroups: [apps]
        resources: [deployments]
        verbs: [get, patch, delete]
      - apiGroups: [batch]
        resources: [cronjobs]
        verbs: [get, patch, delete]
      - apiGroups: [policy]
        resources: [poddisruptionbudgets]
        verbs: [get, patch, delete]
      - apiGroups: [""]
        resources: [pods, pods/log, endpoints]
        verbs: [get]
      - apiGroups: [""]
        resources: [events]
        verbs: [list]
      - apiGroups: [apps]
        resources: [replicasets]
        verbs: [get]
      - apiGroups: [batch]
        resources: [jobs]
        verbs: [get]
      - apiGroups: [discovery.k8s.io]
        resources: [endpointslices]
        verbs: [get]
repoServer:
  # The repository server runs Git, Helm, Kustomize and plugins with the
  # content of the repositories, and needs no token of the Kubernetes API
  # (see docs/security.md).
  automountServiceAccountToken: false
  serviceAccount:
    automountServiceAccountToken: false
  # Git uses curl, and curl connects to 127.0.0.1 for all *.localhost
  # names without DNS. This forwarder makes forgejo.localhost:30300 work in
  # the repository server.
  extraContainers:
    - name: forgejo-forwarder
      image: docker.io/alpine/socat:1.8.1.3@sha256:fb3862c949af7c79996d0e514ee96128644d840835ed5368eeecb14a869de361
      args:
        - TCP-LISTEN:30300,bind=127.0.0.1,fork,reuseaddr
        - TCP:forgejo-http.forgejo.svc.cluster.local:30300
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 64Mi }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault

# The application controller can write only the kinds that the projects of
# Squared permit (deploy/kind/argocd-platform.yaml and the tenant
# projects), not the cluster-admin rights of the chart. It reads the
# objects that these kinds make. It cannot read Secrets outside its
# namespace. It can bind only the ClusterRole of the worker (see
# docs/security.md).
controller:
  clusterRoleRules:
    enabled: true
    rules:
      - apiGroups: [""]
        resources: [namespaces, resourcequotas, limitranges, configmaps, serviceaccounts, services]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [networking.k8s.io]
        resources: [networkpolicies, ingresses]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [rolebindings]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [apps]
        resources: [deployments]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [batch]
        resources: [cronjobs]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [policy]
        resources: [poddisruptionbudgets]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [clusterroles]
        resourceNames: [squared-worker-pull-secrets]
        verbs: [bind]
      # The objects that the Deployments and CronJobs make, for the health
      # and the resource tree.
      - apiGroups: [""]
        resources: [pods, endpoints, events]
        verbs: [get, list, watch]
      - apiGroups: [apps]
        resources: [replicasets]
        verbs: [get, list, watch]
      - apiGroups: [batch]
        resources: [jobs]
        verbs: [get, list, watch]
      - apiGroups: [discovery.k8s.io]
        resources: [endpointslices]
        verbs: [get, list, watch]
      # With resource.respectRBAC, Argo CD caches only the kinds that it can
      # list in the cluster. The Role of the chart has the Argo CD kinds only
      # in its namespace, thus without this rule the root application cannot
      # remove applications or repair the tenant projects.
      - apiGroups: [argoproj.io]
        resources: [applications, appprojects]
        verbs: [get, list, watch]

# Redis is the cache of Argo CD and needs no token of the Kubernetes API.
# It gets its own service account, not the account default of the
# namespace. hack/kind-up.sh makes its password, thus the chart needs no
# job with the right to make Secrets in the namespace of Argo CD (see
# docs/security.md).
redis:
  existingSecret: argocd-redis
  automountServiceAccountToken: false
  serviceAccount:
    create: true
    automountServiceAccountToken: false
redisSecretInit:
  enabled: false

# With metrics, the chart makes a NetworkPolicy for the ApplicationSet
# controller, which lets all namespaces connect to the metrics, and no pod
# to the webhook: Forgejo sends its events to the API server (see
# docs/security.md). Without it, each pod can connect to both.
applicationSet:
  metrics:
    enabled: true
