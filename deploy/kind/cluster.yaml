# Kind cluster for Squared development. hack/kind-up.sh uses this file.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: squared
networking:
  # In iptables mode, NodePorts answer on localhost of the node. The
  # container runtime of the node pulls images from Harbor at
  # localhost:30002, the same address as on the developer machine.
  kubeProxyMode: iptables
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # Squared
        hostPort: 30080
        listenAddress: 127.0.0.1
      - containerPort: 30300 # Forgejo
        hostPort: 30300
        listenAddress: 127.0.0.1
      - containerPort: 30002 # Harbor
        hostPort: 30002
        listenAddress: 127.0.0.1
      - containerPort: 30081 # Argo CD
        hostPort: 30081
        listenAddress: 127.0.0.1
      - containerPort: 30180 # Keycloak
        hostPort: 30180
        listenAddress: 127.0.0.1
