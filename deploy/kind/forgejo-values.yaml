# Forgejo for development (chart forgejo-helm/forgejo). The admin password
# and the Keycloak client secret come from hack/kind-up.sh.
#
# Forgejo has the address http://forgejo.localhost:30300 everywhere:
# browsers resolve *.localhost to the loopback address, and CoreDNS
# resolves forgejo.localhost to this service, which has the same port.
# Thus links, webhooks, Argo CD and the sign-in with Keycloak all use one
# address.
service:
  http:
    type: NodePort
    port: 30300
    nodePort: 30300
persistence:
  size: 2Gi
gitea:
  admin:
    # A local administrator for emergencies and for hack/kind-up.sh.
    username: forgejo-admin
    email: forgejo-admin@local.invalid
    passwordMode: keepUpdated
  # The database password comes from the secret forgejo-db.
  additionalConfigFromEnvs:
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-db
          key: password
  # Sign-in with Keycloak. The chart makes the authentication source at
  # start. Members of the Keycloak group squared-admins are Forgejo
  # administrators.
  oauth:
    - name: keycloak
      provider: openidConnect
      existingSecret: forgejo-oauth
      autoDiscoverUrl: http://keycloak.localhost:30180/realms/squared/.well-known/openid-configuration
      groupClaimName: groups
      adminGroup: /squared-admins
  config:
    APP_NAME: Forgejo for Squared
    server:
      ROOT_URL: http://forgejo.localhost:30300/
      DISABLE_SSH: true
    service:
      # New accounts come only from Keycloak.
      DISABLE_REGISTRATION: false
      ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      SHOW_REGISTRATION_BUTTON: false
      REQUIRE_SIGNIN_VIEW: true
      # The web form accepts no passwords: people sign in only with
      # Keycloak. The local administrator and the bots use the API (basic
      # authentication or tokens) and the command line in the pod.
      ENABLE_INTERNAL_SIGNIN: false
    admin:
      # Keycloak users cannot set a Forgejo password. Forgejo would accept
      # it for API basic authentication, also after Keycloak disabled the
      # user.
      EXTERNAL_USER_DISABLE_FEATURES: manage_password
    openid:
      ENABLE_OPENID_SIGNIN: false
      ENABLE_OPENID_SIGNUP: false
    oauth2_client:
      ENABLE_AUTO_REGISTRATION: true
      # The user name is the Keycloak user name (preferred_username),
      # which is unique and which only administrators can change.
      USERNAME: nickname
      # Forgejo finds the account of a Keycloak user by the Keycloak user
      # ID (sub). The Squared worker makes the accounts of tenant members
      # with that ID before their first sign-in. Never link by the name or
      # the email address: Forgejo would then give an existing account,
      # for example the local administrator, to another person.
      ACCOUNT_LINKING: disabled
      UPDATE_AVATAR: false
    # PostgreSQL (deploy/kind/forgejo-db.yaml). The guard reads the
    # authentication sources from a view in this database, also after a
    # change in the Forgejo web interface.
    database:
      DB_TYPE: postgres
      HOST: forgejo-db.forgejo.svc.cluster.local:5432
      NAME: forgejo
      USER: forgejo
      SSL_MODE: disable
    webhook:
      # Webhooks can send requests only to the internet and to Argo CD.
      # A pattern like "*.svc.cluster.local" would let the webhooks of all
      # users, also of personal repositories, reach every service in the
      # cluster. The guard checks this (webhookHosts in guard.json).
      ALLOWED_HOST_LIST: "external,argocd-server.argocd.svc.cluster.local"
    security:
      INSTALL_LOCK: true
    repository:
      DEFAULT_PRIVATE: private

# The guard checks the sign-in and registration settings in app.ini.
# Forgejo has no API for them, thus this sidecar serves them, and never a
# secret (see "squared forgejo-config" in docs/configuration.md).
# It runs as the Forgejo user, because app.ini has the mode 0600, and it
# mounts only the directory of app.ini, read-only. It has no readiness
# probe and never stops because of app.ini, so that it cannot make the pod
# of Forgejo not ready.
extraContainers:
  - name: squared-forgejo-config
    image: localhost/squared:dev
    imagePullPolicy: Never
    args: ["forgejo-config"]
    env:
      - name: SQUARED_FORGEJO_APP_INI
        value: /forgejo-conf/app.ini
      - name: SQUARED_LISTEN
        value: ":8083"
    ports:
      - name: config
        containerPort: 8083
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
    volumeMounts:
      - name: data
        mountPath: /forgejo-conf
        subPath: gitea/conf
        readOnly: true

