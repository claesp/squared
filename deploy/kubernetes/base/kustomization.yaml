# Squared on Kubernetes. Overlays set the configuration and the image.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - server.yaml
  - worker.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: squared
    includeSelectors: false
