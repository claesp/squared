apiVersion: apps/v1
kind: Deployment
metadata:
  name: squared-worker
  namespace: squared
  labels:
    app.kubernetes.io/name: squared-worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: squared-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squared-worker
    spec:
      serviceAccountName: squared-worker
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # The secret files belong to this group. Only the group can read them.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: squared
          args: ["worker"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: squared-config
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets
              mountPath: /etc/squared/secrets
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: squared-worker
            defaultMode: 0440
