# Read access of the guard to the configurations of the services. Each
# role names the objects, where Kubernetes permits it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: squared-guard
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["argocd-rbac-cm", "argocd-cmd-params-cm"]
    verbs: ["get"]
  - apiGroups: ["argoproj.io"]
    resources: ["appprojects"]
    verbs: ["get", "list"]
  # The settings of the namespaces in which Argo CD reads applications.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["argocd-application-controller"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["argocd-server", "argocd-applicationset-controller"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squared-guard
  namespace: argocd
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: squared-guard }
subjects:
  - { kind: ServiceAccount, name: squared-guard, namespace: squared-guard }
---
# Argo CD can read applications in other namespaces, thus the guard reads
# them in all namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: squared-guard-applications
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: squared-guard-applications
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: squared-guard-applications }
subjects:
  - { kind: ServiceAccount, name: squared-guard, namespace: squared-guard }
---
# The configuration of Squared has a hash in its name, thus the guard
# lists the ConfigMaps with the label squared.dev/config.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: squared-guard
  namespace: squared
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squared-guard
  namespace: squared
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: squared-guard }
subjects:
  - { kind: ServiceAccount, name: squared-guard, namespace: squared-guard }
