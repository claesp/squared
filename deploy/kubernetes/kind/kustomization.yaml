# Squared in the Kind development cluster. Each object names its namespace,
# because some objects are in the namespace of Argo CD. hack/kind-up.sh makes the
# secrets "squared-server", "squared-worker", "postgres" and "rabbitmq".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - postgres.yaml
  - rabbitmq.yaml
  - guard-rbac.yaml
images:
  - name: squared
    newName: localhost/squared
    newTag: dev
patches:
  - target:
      kind: Service
      name: squared-server
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target:
      kind: Deployment
      name: squared-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
configMapGenerator:
  # The guard reads the groups of the guard configuration below.
  - name: squared-guard-config
    namespace: squared-guard
    files:
      - guard.json
  - name: squared-guard-env
    namespace: squared-guard
    literals:
      - SQUARED_LOG_FORMAT=json
      - SQUARED_KEYCLOAK_URL=http://keycloak.localhost:30180
      - SQUARED_KEYCLOAK_REALM=squared
      - SQUARED_KEYCLOAK_CLIENT_ID=squared-guard
      - SQUARED_KEYCLOAK_CLIENT_SECRET_FILE=/etc/squared/secrets/keycloak-client-secret
      - SQUARED_GUARD_INTERVAL=10s
  # The guard finds this configuration by the label squared.dev/config.
  - name: squared-config
    namespace: squared
    options:
      labels:
        squared.dev/config: "true"
    literals:
      - SQUARED_LOG_FORMAT=json
      - SQUARED_DATABASE_URL_FILE=/etc/squared/secrets/database-url
      - SQUARED_AMQP_URL_FILE=/etc/squared/secrets/amqp-url
      # Users sign in with Keycloak. Members of the Keycloak group
      # "squared-admins" are platform administrators.
      - SQUARED_LOCAL_LOGIN=false
      # CoreDNS resolves keycloak.localhost to the Keycloak service, thus
      # the server and the browser use the same address.
      - SQUARED_OIDC_ISSUER=http://keycloak.localhost:30180/realms/squared
      - SQUARED_OIDC_CLIENT_ID=squared
      - SQUARED_OIDC_CLIENT_SECRET_FILE=/etc/squared/secrets/oidc-client-secret
      - SQUARED_OIDC_REDIRECT_URL=http://localhost:30080/auth/callback
      - SQUARED_OIDC_POST_LOGOUT_URL=http://localhost:30080/login
      - SQUARED_OIDC_ADMIN_GROUP=/squared-admins
      - SQUARED_OIDC_API_AUDIENCE=squared-api
      # The worker copies the members of each tenant to Keycloak groups,
      # Harbor project members and a Forgejo team.
      - SQUARED_KEYCLOAK_URL=http://keycloak.localhost:30180
      - SQUARED_KEYCLOAK_REALM=squared
      - SQUARED_KEYCLOAK_CLIENT_ID=squared-worker
      - SQUARED_KEYCLOAK_CLIENT_SECRET_FILE=/etc/squared/secrets/keycloak-client-secret
      # The browser uses http://localhost:30080. Browsers accept Secure
      # cookies on localhost also without TLS.
      - SQUARED_COOKIE_SECURE=true
      - SQUARED_REGISTRY_HOST=localhost:30002
      - SQUARED_GIT_PUBLIC_URL=http://forgejo.localhost:30300
      - SQUARED_GIT_ORG=squared
      - SQUARED_FORGEJO_URL=http://forgejo.localhost:30300
      - SQUARED_FORGEJO_TOKEN_FILE=/etc/squared/secrets/forgejo-token
      # ID of the authentication source "keycloak" in Forgejo. The worker
      # makes the accounts of tenant members for this source. Forgejo has
      # no API for the sources; hack/kind-up.sh checks the value.
      - SQUARED_FORGEJO_AUTH_SOURCE_ID=1
      - SQUARED_ARGOCD_REPO_URL=http://forgejo.localhost:30300
      - SQUARED_ARGOCD_NAMESPACE=argocd
      - SQUARED_HARBOR_URL=http://harbor.harbor.svc.cluster.local
      - SQUARED_HARBOR_USER=admin
      - SQUARED_HARBOR_PASSWORD_FILE=/etc/squared/secrets/harbor-password
      - SQUARED_STATUS_INTERVAL=5s
