{{define "content"}}
<h2>New deployment: select a package</h2>
<div class="cards">
{{- range .Data}}
  <article class="card">
    <h3>{{.Title}}</h3>
    <p>{{.Description}}</p>
    <p class="muted"><code>{{.Name}}</code> version {{.Version}}</p>
    <a class="button primary" href="/tenants/{{$.Access.Tenant.Slug}}/new/{{.Name}}">Select</a>
  </article>
{{- end}}
</div>
{{end}}
