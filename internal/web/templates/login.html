{{define "content"}}
<section class="narrow card">
  <h1>Sign in</h1>
  {{- if .Data.SSO}}
  <p><a class="button primary wide" href="/auth/login?next={{.Value "next"}}">Sign in with {{.Data.SSOName}}</a></p>
  {{- end}}
  {{- if .Data.Local}}
  {{- if .Data.SSO}}<p class="muted divider">or with a password</p>{{end}}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{.Value "next"}}">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="username" required {{if not .Data.SSO}}autofocus{{end}} value="{{.Value "email"}}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="{{if not .Data.SSO}}primary{{end}}">Sign in</button>
  </form>
  {{- end}}
</section>
{{end}}
