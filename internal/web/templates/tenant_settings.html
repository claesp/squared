{{define "content"}}
<section class="card">
  <h2>Settings</h2>
  <form method="post" action="/tenants/{{.Access.Tenant.Slug}}/settings">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label for="name">Name</label>
    <input id="name" name="name" required maxlength="100" value="{{.Value "name"}}">
    {{with .FieldError "name"}}<p class="field-error">{{.}}</p>{{end}}
    <fieldset>
      <legend>Quota for each environment</legend>
      <div class="row">
        <div><label for="quota_cpu">CPU</label><input id="quota_cpu" name="quota_cpu" required value="{{.Value "quota_cpu"}}">{{with .FieldError "quota_cpu"}}<p class="field-error">{{.}}</p>{{end}}</div>
        <div><label for="quota_memory">Memory</label><input id="quota_memory" name="quota_memory" required value="{{.Value "quota_memory"}}">{{with .FieldError "quota_memory"}}<p class="field-error">{{.}}</p>{{end}}</div>
        <div><label for="quota_pods">Pods</label><input id="quota_pods" name="quota_pods" type="number" min="1" max="1000" required value="{{.Value "quota_pods"}}">{{with .FieldError "quota_pods"}}<p class="field-error">{{.}}</p>{{end}}</div>
      </div>
    </fieldset>
    <button class="primary">Save</button>
  </form>
</section>
{{end}}
